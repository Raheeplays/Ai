<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase RTDB Write Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 250px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2>Bhai, Data Firebase Me Write Karo</h2>
    
    <div class="form-group">
        <label for="name">Naam:</label>
        <input type="text" id="name" placeholder="Apna naam daalo">
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Apna email daalo">
    </div>

    <button id="submitBtn">Database Me Save Karo</button>

    <!-- Firebase SDK Modules -->
    <script type="module">
        // Firebase libraries import karein
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push } from "https://gstatic.com";

        // TODO: Apne Firebase Console se ye config copy karke yahan paste karein
        const firebaseConfig = {
  apiKey: "AIzaSyCHWFOq27Q3gkMhJt8rXLsyLj6T2yzn77I",
  authDomain: "rahee-xuv.firebaseapp.com",
  databaseURL: "https://rahee-xuv-default-rtdb.firebaseio.com",
  projectId: "rahee-xuv",
  storageBucket: "rahee-xuv.firebasestorage.app",
  messagingSenderId: "956979051682",
  appId: "1:956979051682:web:4fbfa72e130085d4dd2bfb"
};

        // Firebase Initialize karein
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // HTML elements ko select karein
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');

        // Button click event listener
        submitBtn.addEventListener('click', () => {
            const name = nameInput.value;
            const email = emailInput.value;

            if(name === '' || email === '') {
                alert("Bhai, dono fields bharna zaroori hai!");
                return;
            }

            // 'users' node ke andar auto-generated ID ke sath data push hoga
            push(ref(db, 'users'), {
                username: name,
                email: email,
                timestamp: Date.now()
            })
            .then(() => {
                alert("Mubarak ho bhai! Data successfully save ho gaya.");
                // Form clear karne ke liye
                nameInput.value = '';
                emailInput.value = '';
            })
            .catch((error) => {
                console.error("Write fail ho gaya:", error);
                alert("Error aaya bhai! Console check karo.");
            });
        });
    </script>
</body>
</html>
